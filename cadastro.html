<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Essência Gym | Criar conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="login-wrap">

        <section class="painel-marca">

            <img 
                src="assets/logo-essencia-gym.png" 
                alt="Logo Essência Gym"
            >

            <div class="linha-ouro"></div>

            <p class="frase">
                DISCIPLINA &nbsp;•&nbsp; CONSTÂNCIA &nbsp;•&nbsp; RESULTADOS
            </p>

        </section>

        <section class="painel-form">

            <form class="form-cadastro" novalidate>

                <h1 class="titulo-form">
                    Crie sua conta
                </h1>

                <p class="subtitulo-form">
                    Junte-se à Essência Gym e comece a acompanhar seus treinos.
                </p>

                <div class="campo" data-tipo="nome">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        id="nome"
                        type="text"
                        name="nome"
                        placeholder="Seu nome completo"
                        autocomplete="name"
                    >

                    <span class="mensagem-erro">
                        Informe seu nome completo.
                    </span>

                </div>

                <div class="campo" data-tipo="email">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                    >

                    <span class="mensagem-erro">
                        Informe um e-mail válido.
                    </span>

                </div>

                <div class="campo" data-tipo="senha">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="campo-senha">

                        <input
                            id="senha"
                            type="password"
                            name="senha"
                            placeholder="Crie uma senha"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="botao-olho"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>

                    </div>

                    <span class="mensagem-erro">
                        A senha precisa ter no mínimo 6 caracteres.
                    </span>

                </div>

                <div class="campo" data-tipo="confirmar-senha">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <div class="campo-senha">

                        <input
                            id="confirmarSenha"
                            type="password"
                            name="confirmarSenha"
                            placeholder="Repita a senha"
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="botao-olho"
                            aria-label="Mostrar senha"
                        >
                            Mostrar
                        </button>

                    </div>

                    <span class="mensagem-erro">
                        As senhas não coincidem.
                    </span>

                </div>
                <button
                    type="submit"
                    class="botao-entrar"
                >
                    Criar conta
                </button>
                <p class="rodape-form">

                    Já tem uma conta?

                    <a href="login.html">
                        Entrar
                    </a>

                </p>

            </form>

        </section>

    </main>

    <script src="js/cadastro.js"></script>

</body>

</html>
